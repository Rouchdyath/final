<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Étudiants - EduSphère</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .page-wrapper { display: grid; grid-template-columns: 300px 1fr; width: 100%; min-height: 100vh; }
        .sidebar-wrapper { background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.08); position: fixed; left: 0; top: 0; width: 300px; height: 100vh; overflow-y: auto; z-index: 100; }
        .content-wrapper { grid-column: 2; padding: 30px 40px; overflow-y: auto; background: #f5f7fa; }
        .content-header { background: white; padding: 30px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .content-header h1 { color: #2c3e50; font-size: 28px; margin: 0; font-weight: 700; }
        .content-main { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .filters { margin-bottom: 30px; padding: 20px; background: #f9f9f9; border-radius: 4px; }
        .filters label { display: block; margin-bottom: 8px; color: #2c3e50; font-weight: 600; }
        .filters select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        table th { background: #f0f0f0; color: #2c3e50; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        table td { padding: 12px; border-bottom: 1px solid #eee; }
        table tr:hover { background: #f9f9f9; }
        .empty-state { text-align: center; padding: 60px 30px; color: #999; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #d4edda; color: #155724; }
        @media (max-width: 768px) { .page-wrapper { grid-template-columns: 1fr; } .sidebar-wrapper { width: 100%; height: auto; position: relative; } .content-wrapper { grid-column: 1; padding: 15px; } }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div id="sidebar-wrapper"></div>
        <div class="content-wrapper">
            <div class="content-header">
                <h1>👨‍🎓 Mes Étudiants</h1>
                <p>Les étudiants inscrits dans vos espaces</p>
            </div>
            <div class="content-main">
                <div class="filters">
                    <label for="espaceFilter">Filtrer par Espace:</label>
                    <select id="espaceFilter" onchange="filterBySpace()">
                        <option value="">-- Tous les espaces --</option>
                    </select>
                </div>
                <div id="studentsContainer"></div>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        window.addEventListener('load', function() {
            const user = getCurrentUser();
            if (!isLoggedIn() || user.role !== 'formateur') {
                window.location.href = 'login.html';
            }
            loadMesEspaces();
            loadStudents();
        });

        function loadMesEspaces() {
            const user = getCurrentUser();
            const espaces = JSON.parse(localStorage.getItem('espaces') || '[]');
            
            // Filtrer les espaces du formateur
            const mesEspaces = espaces.filter(e => 
                e.formateurs && (e.formateurs.includes(user.id) || e.formateurs.includes(user.identifier))
            );

            let html = '<option value="">-- Tous les espaces --</option>';
            mesEspaces.forEach(e => {
                html += `<option value="${e.id}">${e.matiere}</option>`;
            });
            document.getElementById('espaceFilter').innerHTML = html;
        }

        function filterBySpace() {
            loadStudents();
        }

        function loadStudents() {
            const user = getCurrentUser();
            const espaceFilter = document.getElementById('espaceFilter').value;
            const espaces = JSON.parse(localStorage.getItem('espaces') || '[]');
            const users = JSON.parse(localStorage.getItem('app_users') || '[]');
            
            let mesEspaces = espaces.filter(e => 
                e.formateurs && (e.formateurs.includes(user.id) || e.formateurs.includes(user.identifier))
            );
            
            if (espaceFilter) {
                mesEspaces = mesEspaces.filter(e => e.id === espaceFilter);
            }
            
            // Collecter tous les étudiants des espaces du formateur
            const studentIds = new Set();
            mesEspaces.forEach(e => {
                (e.etudiants || []).forEach(id => studentIds.add(id));
            });
            
            const students = Array.from(studentIds).map(id => 
                users.find(u => u.id === id || u.identifier === id)
            ).filter(u => u && u.role === 'etudiant');
            
            let html = '';
            if (students.length === 0) {
                html = '<div class="empty-state"><div style="font-size: 80px;">👨‍🎓</div><h2>Aucun étudiant</h2><p>Les étudiants inscrits dans vos espaces apparaîtront ici</p></div>';
            } else {
                html = '<table><thead><tr><th>Identifiant</th><th>Nom</th><th>Email</th><th>Créé le</th></tr></thead><tbody>';
                students.forEach(student => {
                    const createdDate = new Date(student.dateCreation || new Date()).toLocaleDateString('fr-FR');
                    html += `<tr>
                        <td><strong>${student.identifier}</strong></td>
                        <td>${student.nom || '-'}</td>
                        <td>${student.email}</td>
                        <td>${createdDate}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }
            document.getElementById('studentsContainer').innerHTML = html;
        }
    </script>
</body>
</html>
