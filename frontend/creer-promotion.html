<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une Promotion - EduSphère</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .page-wrapper { display: grid; grid-template-columns: 300px 1fr; width: 100%; min-height: 100vh; }
        .sidebar-wrapper { background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.08); position: fixed; left: 0; top: 0; width: 300px; height: 100vh; overflow-y: auto; z-index: 100; }
        .content-wrapper { grid-column: 2; padding: 30px 40px; overflow-y: auto; background: #f5f7fa; }
        .content-header { background: white; padding: 30px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .content-header h1 { color: #2c3e50; font-size: 28px; margin: 0; font-weight: 700; }
        .content-main { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 800px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #3498db; background: #f0f7ff; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        .btn { padding: 12px 24px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; font-size: 14px; }
        .btn:hover { background: #229954; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(39,174,96,0.3); }
        .btn-secondary { background: #95a5a6; margin-left: auto; }
        .btn-secondary:hover { background: #7f8c8d; }
        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .form-help { color: #999; font-size: 13px; margin-top: 5px; }
        @media (max-width: 768px) { .page-wrapper { grid-template-columns: 1fr; } .sidebar-wrapper { width: 100%; height: auto; position: relative; } .content-wrapper { grid-column: 1; padding: 15px; } .form-row { grid-template-columns: 1fr; } .btn-group { flex-direction: column; } .btn-secondary { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div id="sidebar-wrapper"></div>
        <div class="content-wrapper">
            <div class="content-header">
                <h1>📚 Créer une Promotion</h1>
                <p>Ajoutez une nouvelle promotion dans le système</p>
            </div>
            <div class="content-main">
                <div id="alertBox"></div>
                <form id="promotionForm" onsubmit="createPromotion(event)">
                    <div class="form-group">
                        <label for="nom">Nom de la Promotion *</label>
                        <input type="text" id="nom" placeholder="Ex: Promotion 2024-2025" required>
                        <div class="form-help">Exemple: Licence 3ème année 2024-2025</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="code">Code Promotion *</label>
                            <input type="text" id="code" placeholder="Ex: PROM2024" required>
                            <div class="form-help">Code unique (alphanumérique)</div>
                        </div>
                        <div class="form-group">
                            <label for="niveau">Niveau</label>
                            <input type="text" id="niveau" placeholder="Ex: L3, M1, M2">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateDebut">Date de Début *</label>
                            <input type="date" id="dateDebut" required>
                        </div>
                        <div class="form-group">
                            <label for="dateFin">Date de Fin *</label>
                            <input type="date" id="dateFin" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="4" placeholder="Informations complémentaires..."></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn">✅ Créer la Promotion</button>
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='liste-promotions.html'">Annuler</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (!isLoggedIn() || getCurrentUser().role !== 'directeur') {
                window.location.href = 'login.html';
            }
        });
        function createPromotion(event) {
            event.preventDefault();
            const nom = document.getElementById('nom').value.trim();
            const code = document.getElementById('code').value.trim().toUpperCase();
            const niveau = document.getElementById('niveau').value.trim();
            const dateDebut = document.getElementById('dateDebut').value;
            const dateFin = document.getElementById('dateFin').value;
            const description = document.getElementById('description').value.trim();
            if (!nom || !code || !dateDebut || !dateFin) {
                showAlert('❌ Tous les champs obligatoires doivent être remplis', 'danger');
                return;
            }
            const debut = new Date(dateDebut);
            const fin = new Date(dateFin);
            if (fin <= debut) {
                showAlert('❌ La date de fin doit être après la date de début', 'danger');
                return;
            }
            const promotions = JSON.parse(localStorage.getItem('promotions') || '[]');
            if (promotions.some(p => p.code === code)) {
                showAlert('❌ Ce code de promotion existe déjà', 'danger');
                return;
            }
            const newPromotion = {
                id: Date.now().toString(),
                nom,
                code,
                niveau,
                dateDebut,
                dateFin,
                description,
                etudiants: [],
                formateurs: [],
                dateCreation: new Date().toISOString()
            };
            promotions.push(newPromotion);
            localStorage.setItem('promotions', JSON.stringify(promotions));
            showAlert('✅ Promotion créée avec succès !', 'success');
            setTimeout(() => {
                window.location.href = 'liste-promotions.html';
            }, 1500);
        }
        function showAlert(msg, type) {
            document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            if (type !== 'danger') {
                setTimeout(() => document.getElementById('alertBox').innerHTML = '', 3000);
            }
        }
    </script>

</script></body>
</html>
