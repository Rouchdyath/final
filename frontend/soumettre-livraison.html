<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soumettre une Livraison - EduSphère</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .page-wrapper { display: grid; grid-template-columns: 300px 1fr; width: 100%; min-height: 100vh; }
        .sidebar-wrapper { background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.08); position: fixed; left: 0; top: 0; width: 300px; height: 100vh; overflow-y: auto; z-index: 100; }
        .content-wrapper { grid-column: 2; padding: 30px 40px; overflow-y: auto; background: #f5f7fa; }
        .content-header { background: white; padding: 30px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .content-header h1 { color: #2c3e50; font-size: 28px; margin: 0; font-weight: 700; }
        .content-header p { color: #666; margin-top: 8px; }
        .form-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 700px; }
        
        .section { margin-bottom: 40px; }
        .section h2 { color: #2c3e50; font-size: 18px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: #2c3e50; font-weight: 600; }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select,
        textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            font-family: inherit; 
            font-size: 14px; 
        }
        textarea { resize: vertical; min-height: 120px; }
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: #3498db; 
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1); 
        }
        
        .travail-info { background: #f9f9f9; padding: 20px; border-radius: 4px; margin-bottom: 20px; border-left: 4px solid #3498db; }
        .travail-info h3 { color: #2c3e50; margin-bottom: 10px; }
        .info-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 10px; }
        .info-item { color: #666; font-size: 14px; }
        .info-label { font-weight: 600; color: #2c3e50; }
        
        .btn { padding: 12px 24px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.3s; }
        .btn:hover { background: #229954; }
        .btn-secondary { background: #95a5a6; }
        .btn-secondary:hover { background: #7f8c8d; }
        
        .button-group { display: flex; gap: 15px; }
        
        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        
        .empty-state { text-align: center; padding: 60px 30px; color: #999; }
        
        .file-input-wrapper { 
            position: relative; 
            display: inline-block; 
            width: 100%; 
        }
        .file-input-wrapper input[type="file"] { 
            display: none; 
        }
        .file-input-label { 
            display: block; 
            padding: 12px; 
            background: #f0f0f0; 
            border: 2px dashed #3498db; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: center; 
            color: #3498db; 
            font-weight: 600; 
            transition: all 0.3s; 
        }
        .file-input-label:hover { 
            background: #e8f4f8; 
            border-color: #2980b9; 
        }
        .file-name { 
            margin-top: 8px; 
            color: #27ae60; 
            font-size: 14px; 
        }
        
        .character-count { 
            text-align: right; 
            color: #999; 
            font-size: 12px; 
            margin-top: 5px; 
        }
        
        @media (max-width: 768px) { 
            .page-wrapper { grid-template-columns: 1fr; } 
            .sidebar-wrapper { width: 100%; height: auto; position: relative; } 
            .content-wrapper { grid-column: 1; padding: 15px; } 
            .info-row { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div id="sidebar-wrapper"></div>
        <div class="content-wrapper">
            <div class="content-header">
                <h1>📤 Soumettre une Livraison</h1>
                <p>Téléchargez votre travail et remplissez les informations requises</p>
            </div>
            <div class="form-container">
                <div id="alertContainer"></div>
                
                <!-- Sélection du travail -->
                <div class="section">
                    <h2>📋 Choisir le Travail</h2>
                    <div class="form-group">
                        <label for="travailId">Sélectionner le Travail Assigné *</label>
                        <select id="travailId" required onchange="loadTravailDetails()">
                            <option value="">-- Choisir un travail --</option>
                        </select>
                    </div>
                    <div id="travailDetailsContainer"></div>
                </div>

                <!-- Formulaire de livraison -->
                <form id="livraisonForm" onsubmit="submitLivraison(event)" style="display: none;">
                    <!-- Infos personnelles -->
                    <div class="section">
                        <h2>👤 Vos Informations</h2>
                        
                        <div class="form-group">
                            <label for="etudiantId">Identifiant Étudiant</label>
                            <input type="text" id="etudiantId" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="nom">Nom Complet</label>
                            <input type="text" id="nom" placeholder="Votre nom complet" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" readonly>
                        </div>
                    </div>

                    <!-- Fichier de livraison -->
                    <div class="section">
                        <h2>📎 Fichier de Livraison</h2>
                        
                        <div class="form-group">
                            <label for="fichier">Télécharger votre fichier *</label>
                            <div class="file-input-wrapper">
                                <input type="file" id="fichier" required onchange="updateFileName()">
                                <label for="fichier" class="file-input-label">
                                    📁 Cliquez pour télécharger ou glissez-déposez votre fichier
                                </label>
                                <div class="file-name" id="fileName"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="urlLivraison">Ou un lien externe (URL)</label>
                            <input type="url" id="urlLivraison" placeholder="https://exemple.com/mon-travail">
                        </div>
                    </div>

                    <!-- Notes et commentaires -->
                    <div class="section">
                        <h2>✍️ Détails de la Livraison</h2>
                        
                        <div class="form-group">
                            <label for="description">Description / Notes *</label>
                            <textarea id="description" placeholder="Décrivez brièvement votre travail, les points clés, les défis rencontrés, etc." required></textarea>
                            <div class="character-count"><span id="charCount">0</span>/1000</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="commentaires">Commentaires Additionnels</label>
                            <textarea id="commentaires" placeholder="Ajoutez d'autres informations ou commentaires si nécessaire"></textarea>
                        </div>
                    </div>

                    <!-- Informations de remise -->
                    <div class="section">
                        <h2>📅 Information de Remise</h2>
                        
                        <div class="form-group">
                            <label for="dateRemise">Date de Remise</label>
                            <input type="date" id="dateRemise" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="heureRemise">Heure de Remise</label>
                            <input type="time" id="heureRemise" required>
                        </div>
                        
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="confirmCheckbox" required>
                                Je confirme que ce travail est mon propre travail et respecte les règles d'intégrité académique
                            </label>
                        </div>
                    </div>

                    <!-- Boutons -->
                    <div class="button-group">
                        <button type="submit" class="btn">✅ Soumettre la Livraison</button>
                        <button type="reset" class="btn btn-secondary">🔄 Réinitialiser</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        window.addEventListener('load', function() {
            const user = getCurrentUser();
            if (!isLoggedIn() || user.role !== 'etudiant') {
                window.location.href = 'login.html';
            }
            loadUserInfo();
            loadMesTravaux();
        });

        function loadUserInfo() {
            const user = getCurrentUser();
            document.getElementById('etudiantId').value = user.identifier;
            document.getElementById('email').value = user.email;
            document.getElementById('nom').value = user.nom || '';
        }

        function loadMesTravaux() {
            const user = getCurrentUser();
            const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
            
            // Filtrer les travaux assignés à l'étudiant
            const mesTravaux = travaux.filter(t => 
                t.assignations && t.assignations.includes(user.id)
            );

            let html = '<option value="">-- Choisir un travail --</option>';
            mesTravaux.forEach(t => {
                const dateEchéance = new Date(t.dateEchéance);
                html += `<option value="${t.id}" data-date="${t.dateEchéance}">${t.titre} - Échéance: ${dateEchéance.toLocaleDateString('fr-FR')}</option>`;
            });
            document.getElementById('travailId').innerHTML = html;
        }

        function loadTravailDetails() {
            const travailId = document.getElementById('travailId').value;
            const form = document.getElementById('livraisonForm');
            const detailsContainer = document.getElementById('travailDetailsContainer');

            if (!travailId) {
                detailsContainer.innerHTML = '';
                form.style.display = 'none';
                return;
            }

            const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
            const espaces = JSON.parse(localStorage.getItem('espaces') || '[]');
            
            const travail = travaux.find(t => t.id === travailId);
            if (!travail) return;
            
            const espace = espaces.find(e => e.id === travail.espaceId);
            const dateEchéance = new Date(travail.dateEchéance);
            const maintenant = new Date();
            const enRetard = maintenant > dateEchéance;
            const status = enRetard ? '⏰ EN RETARD' : '✅ À TEMPS';
            const statusClass = enRetard ? 'color: #e74c3c;' : 'color: #27ae60;';

            let html = `
                <div class="travail-info">
                    <h3>📚 ${travail.titre}</h3>
                    <div class="info-row">
                        <div class="info-item">
                            <span class="info-label">Espace:</span> ${espace ? espace.matiere : 'N/A'}
                        </div>
                        <div class="info-item">
                            <span class="info-label">Code:</span> ${espace ? espace.code : 'N/A'}
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-item">
                            <span class="info-label">Échéance:</span> ${dateEchéance.toLocaleDateString('fr-FR')} ${dateEchéance.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}
                        </div>
                        <div class="info-item">
                            <span class="info-label" style="${statusClass}">${status}</span>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-item">
                            <span class="info-label">Description:</span> ${travail.description || 'Aucune description'}
                        </div>
                    </div>
                </div>
            `;
            detailsContainer.innerHTML = html;
            
            // Remplir la date de remise
            document.getElementById('dateRemise').value = new Date().toISOString().split('T')[0];
            
            // Afficher le formulaire
            form.style.display = 'block';
        }

        function updateFileName() {
            const fileInput = document.getElementById('fichier');
            const fileName = document.getElementById('fileName');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName.textContent = `✅ Fichier sélectionné: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            } else {
                fileName.textContent = '';
            }
        }

        // Compteur de caractères
        document.addEventListener('DOMContentLoaded', function() {
            const description = document.getElementById('description');
            const charCount = document.getElementById('charCount');
            if (description) {
                description.addEventListener('input', function() {
                    charCount.textContent = this.value.length;
                    if (this.value.length > 1000) {
                        this.value = this.value.substring(0, 1000);
                        charCount.textContent = '1000';
                    }
                });
            }
        });

        function submitLivraison(event) {
            event.preventDefault();
            
            const user = getCurrentUser();
            const travailId = document.getElementById('travailId').value;
            const nom = document.getElementById('nom').value.trim();
            const description = document.getElementById('description').value.trim();
            const commentaires = document.getElementById('commentaires').value.trim();
            const heureRemise = document.getElementById('heureRemise').value;
            const fichier = document.getElementById('fichier');
            const urlLivraison = document.getElementById('urlLivraison').value.trim();
            const confirmCheckbox = document.getElementById('confirmCheckbox').checked;

            // Validations
            if (!travailId) {
                showAlert('❌ Veuillez sélectionner un travail', 'danger');
                return;
            }
            if (!nom) {
                showAlert('❌ Veuillez entrer votre nom complet', 'danger');
                return;
            }
            if (!description) {
                showAlert('❌ Veuillez décrire votre livraison', 'danger');
                return;
            }
            if (!heureRemise) {
                showAlert('❌ Veuillez indiquer l\'heure de remise', 'danger');
                return;
            }
            if (!fichier.files.length && !urlLivraison) {
                showAlert('❌ Veuillez télécharger un fichier ou fournir un URL', 'danger');
                return;
            }
            if (!confirmCheckbox) {
                showAlert('❌ Vous devez confirmer que ce travail vous appartient', 'danger');
                return;
            }

            // Créer la livraison
            const livraisons = JSON.parse(localStorage.getItem('livraisons') || '[]');
            const dateRemise = new Date(document.getElementById('dateRemise').value + ' ' + heureRemise);
            
            const nouvelleLivraison = {
                id: Date.now().toString(),
                travailId: travailId,
                etudiantId: user.id,
                nomEtudiant: nom,
                statut: 'soumise',
                description: description,
                commentaires: commentaires,
                urlLivraison: urlLivraison,
                fichier: fichier.files.length > 0 ? fichier.files[0].name : null,
                dateRemise: dateRemise.toISOString(),
                dateCreation: new Date().toISOString(),
                note: null,
                remarques: null,
                dateEvaluation: null
            };

            livraisons.push(nouvelleLivraison);
            localStorage.setItem('livraisons', JSON.stringify(livraisons));
            
            showAlert('✅ Livraison soumise avec succès! Un reçu a été généré.', 'success');
            
            // Générer un reçu
            generateReceipt(nouvelleLivraison);
            
            // Réinitialiser le formulaire
            setTimeout(() => {
                document.getElementById('livraisonForm').reset();
                document.getElementById('travailId').value = '';
                document.getElementById('travailDetailsContainer').innerHTML = '';
                document.getElementById('livraisonForm').style.display = 'none';
                document.getElementById('fileName').textContent = '';
            }, 2000);
        }

        function generateReceipt(livraison) {
            const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
            const travail = travaux.find(t => t.id === livraison.travailId);
            
            const receiptHtml = `
                <div style="background: #d4edda; padding: 15px; border-radius: 4px; margin-top: 15px; border-left: 4px solid #27ae60;">
                    <h3 style="color: #155724; margin: 0 0 10px 0;">✅ Reçu de Livraison</h3>
                    <p style="color: #155724; margin: 5px 0;"><strong>ID Livraison:</strong> ${livraison.id}</p>
                    <p style="color: #155724; margin: 5px 0;"><strong>Travail:</strong> ${travail ? travail.titre : 'N/A'}</p>
                    <p style="color: #155724; margin: 5px 0;"><strong>Date/Heure Remise:</strong> ${new Date(livraison.dateRemise).toLocaleString('fr-FR')}</p>
                    <p style="color: #155724; margin: 5px 0;"><strong>Statut:</strong> ${livraison.statut}</p>
                </div>
            `;
            
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = receiptHtml + (alertContainer.innerHTML || '');
        }

        function showAlert(message, type) {
            const alertHTML = `<div class="alert alert-${type}">${message}</div>`;
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = alertHTML + alertContainer.innerHTML;
            setTimeout(() => {
                if (alertContainer.firstChild) {
                    alertContainer.removeChild(alertContainer.firstChild);
                }
            }, 5000);
        }
    </script>
</body>
</html>
