<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigner Travaux - EduSphère</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .page-wrapper {
            display: grid;
            grid-template-columns: 300px 1fr;
            width: 100%;
            min-height: 100vh;
        }

        .sidebar-wrapper {
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.08);
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .content-wrapper {
            grid-column: 2;
            padding: 30px 40px;
            overflow-y: auto;
            background: #f5f7fa;
        }

        .content-header {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .content-header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin: 0;
            font-weight: 700;
        }

        .content-main {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #2980b9;
        }

        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .alert-info { background: #d1ecf1; color: #0c5460; }

        .assignments-list {
            margin-top: 40px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .assignment-item {
            background: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #3498db;
        }

        .btn-remove {
            background: #e74c3c;
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .page-wrapper { grid-template-columns: 1fr; }
            .sidebar-wrapper { width: 100%; height: auto; position: relative; }
            .content-wrapper { grid-column: 1; padding: 15px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div id="sidebar-wrapper"></div>
        <div class="content-wrapper">
            <div class="content-header">
                <h1>📌 Assigner Travaux aux Étudiants</h1>
                <p>Assignez les travaux créés aux étudiants ou groupes d'étudiants</p>
            </div>
            <div class="content-main">
                <div id="alertBox"></div>

                <h2 style="color: #2c3e50; margin-bottom: 20px; font-size: 22px;">Assigner un Travail</h2>

                <form onsubmit="assignTravail(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Espace Pédagogique</label>
                            <select id="espaceSelect" onchange="loadTravaux()" required>
                                <option value="">-- Sélectionner --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Travail</label>
                            <select id="travailSelect" required>
                                <option value="">-- Sélectionner --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Étudiant(s)</label>
                        <select id="etudiantSelect" multiple size="5" required>
                            <option disabled>Sélectionner les étudiants à assigner</option>
                        </select>
                        <small style="color: #666;">Ctrl+Click pour sélectionner plusieurs</small>
                    </div>

                    <button type="submit" class="btn">✅ Assigner le Travail</button>
                </form>

                <div class="assignments-list">
                    <h3>📋 Assignations Actuelles</h3>
                    <div id="assignmentsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (!isLoggedIn() || !['directeur', 'formateur'].includes(getCurrentUser().role)) {
                window.location.href = 'login.html';
            }
            loadEspaces();
            loadEtudiants();
            loadAssignments();
        });

        function loadEspaces() {
            const espaces = JSON.parse(localStorage.getItem('espaces') || '[]');
            const select = document.getElementById('espaceSelect');
            select.innerHTML = '<option value="">-- Sélectionner un espace --</option>' +
                espaces.map(e => `<option value="${e.id}">${e.matiere} (${e.code})</option>`).join('');
        }

        function loadTravaux() {
            const espaceId = document.getElementById('espaceSelect').value;
            const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
            const filtered = travaux.filter(t => t.espaceId === espaceId);
            const select = document.getElementById('travailSelect');
            select.innerHTML = '<option value="">-- Sélectionner un travail --</option>' +
                filtered.map(t => `<option value="${t.id}">${t.titre}</option>`).join('');
        }

        function loadEtudiants() {
            const users = JSON.parse(localStorage.getItem('app_users') || '[]');
            const etudiants = users.filter(u => u.role === 'etudiant');
            const select = document.getElementById('etudiantSelect');
            select.innerHTML = etudiants.map(e => `<option value="${e.id}">${e.identifier}</option>`).join('');
        }

        function assignTravail(event) {
            event.preventDefault();
            const espaceId = document.getElementById('espaceSelect').value;
            const travailId = document.getElementById('travailSelect').value;
            const etudiantIds = Array.from(document.getElementById('etudiantSelect').selectedOptions).map(o => o.value);

            if (!espaceId || !travailId || etudiantIds.length === 0) {
                showAlert('❌ Sélectionnez un espace, un travail et au moins un étudiant', 'danger');
                return;
            }

            const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
            const travail = travaux.find(t => t.id === travailId);
            if (!travail) return;

            if (!travail.assignations) travail.assignations = [];

            etudiantIds.forEach(etudId => {
                if (!travail.assignations.includes(etudId)) {
                    travail.assignations.push(etudId);
                }
            });

            localStorage.setItem('travaux', JSON.stringify(travaux));
            showAlert(`✅ Travail assigné à ${etudiantIds.length} étudiant(s)`, 'success');
            document.querySelector('form').reset();
            loadAssignments();
        }

        function loadAssignments() {
            const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
            const users = JSON.parse(localStorage.getItem('app_users') || '[]');
            const espaces = JSON.parse(localStorage.getItem('espaces') || '[]');

            let html = '';
            travaux.forEach(travail => {
                if (travail.assignations && travail.assignations.length > 0) {
                    const espace = espaces.find(e => e.id === travail.espaceId);
                    travail.assignations.forEach(etudId => {
                        const etud = users.find(u => u.id === etudId);
                        if (etud) {
                            html += `
                                <div class="assignment-item">
                                    <div>
                                        <strong>${travail.titre}</strong><br>
                                        <small>${etud.identifier} - ${espace ? espace.matiere : 'Espace'}</small>
                                    </div>
                                    <button class="btn btn-remove" onclick="removeAssignment('${travail.id}', '${etudId}')">Retirer</button>
                                </div>
                            `;
                        }
                    });
                }
            });

            document.getElementById('assignmentsList').innerHTML = html || '<p style="color: #999;">Aucune assignation</p>';
        }

        function removeAssignment(travailId, etudId) {
            if (confirm('Retirer cette assignation ?')) {
                const travaux = JSON.parse(localStorage.getItem('travaux') || '[]');
                const travail = travaux.find(t => t.id === travailId);
                if (travail) {
                    travail.assignations = travail.assignations.filter(id => id !== etudId);
                    localStorage.setItem('travaux', JSON.stringify(travaux));
                    showAlert('✅ Assignation supprimée', 'success');
                    loadAssignments();
                }
            }
        }

        function showAlert(msg, type) {
            document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            setTimeout(() => document.getElementById('alertBox').innerHTML = '', 3000);
        }
    </script>
</body>
</html>
